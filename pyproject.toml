[project]
name = "practice-assistant"
version = "1.4"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
exclude = [".venv", "Lib", "Scripts", "Include", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 88
# Relative paths have no leading slash, so the pattern must not require one;
# otherwise Black walks the bundled virtual environment.
extend-exclude = '''
(
  ^/(\.venv|Lib|Scripts|Include|dist)/
  | ^(\.venv|Lib|Scripts|Include|dist)/
)
'''
